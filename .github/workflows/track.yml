name: flight-tracker

on:
  schedule:
    - cron: "0 * * * *"   # hourly (UTC) — radar is free; confirms are daily-capped
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # so the run can commit updated history.json

concurrency:
  group: flight-tracker
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep flights
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 tracker.py

      - name: Build dashboard
        run: python3 build_site.py

      - name: Persist history + dashboard
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json index.html
          git commit -m "sweep $(date -u +%FT%TZ)" || echo "no changes"
          git push
